<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentManager · Git 仓库分支设计稿</title>
<style>
:root{color-scheme:dark;--bg:#1a110f;--low:#231917;--card:#2b201d;--high:#3d322f;--text:#f1dfda;--muted:#cbb7af;--line:#53433f;--accent:#ffb59d;--tint:#5d4037;--good:#b8d7a6;--terminal:#171413;--shadow:#0006}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}body.light{color-scheme:light;--bg:#fff;--low:#f5f3f1;--card:#fff;--high:#ede7e3;--text:#2b2522;--muted:#6c5b53;--line:#d9cec8;--accent:#87442b;--tint:#f6dfd4;--good:#416b32;--terminal:#fff;--shadow:#0002}body.black{--bg:#000;--low:#090909;--card:#141414;--high:#242424;--text:#eee;--muted:#aaa;--line:#373737;--accent:#fff;--tint:#303030;--terminal:#000;--good:#b8d7a6}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;border-radius:24px;padding:9px 14px}button:hover{background:var(--high)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;vertical-align:middle;flex:none}button.icon{padding:8px;display:inline-grid;place-items:center}.muted{color:var(--muted)}.small{font-size:12px}.pill{border:1px solid var(--line);border-radius:30px;padding:4px 10px;font-size:12px}.demo{min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--low)}.demo strong{font-size:13px}.demo select{background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:9px}.demo .right{margin-left:auto;display:flex;gap:8px;align-items:center}.outline{border:1px solid var(--line)}.primary{color:var(--accent);background:var(--tint)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 60px);min-height:520px}.sidebar{padding:25px 12px 15px;background:var(--low);display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:10px;align-items:center;padding:0 10px;font-size:18px;font-weight:650}.brand i{display:grid;place-items:center;width:30px;height:30px;background:var(--tint);border-radius:12px;color:var(--accent);font-style:normal}.add{margin:0 8px;padding:14px;background:var(--tint);border-radius:18px;color:var(--accent);text-align:left}.search{border:1px solid var(--line);border-radius:24px;display:flex;align-items:center;gap:8px;padding:9px 12px}.search input{border:0;background:none;width:100%;min-width:0;outline:none}.group{font-size:12px;color:var(--muted);margin:10px 12px}.project{text-align:left;display:flex;gap:10px;width:100%;padding:12px;border-radius:24px;align-items:flex-start}.project.selected{background:var(--tint)}.project .info{min-width:0}.project strong{font-weight:550;display:block}.project small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{color:var(--good);padding-top:3px}.bottom{margin-top:auto;color:var(--muted)}main{min-width:0;display:flex;flex-direction:column;overflow:hidden}.topbar{height:82px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px}.titles{min-width:0}.titles h1{font-size:20px;margin:0;font-weight:550}.titles div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.actions{display:flex;align-items:center;gap:8px;flex:none}.agent{font-size:12px;color:var(--good);padding:7px 12px}.workspace{position:relative;display:flex;min-height:0;flex:1;gap:12px;padding:0 14px 14px 8px}.terminal{border-radius:22px;background:var(--terminal);flex:1;min-width:0;overflow:auto;border:1px solid var(--line);padding:25px 28px;position:relative;font:13px/1.9 Consolas,'Microsoft YaHei',monospace}.terminal .claude{font-size:16px;font-weight:bold;color:var(--accent)}.terminal .output{margin:28px 0;color:var(--muted)}.terminal .rule{border-top:1px solid var(--line);margin-top:22px;padding-top:10px}.terminal .prompt{color:var(--text)}.terminal .tip{position:absolute;bottom:20px;font-size:11px;color:var(--muted)}.terminal p{margin:7px 0}.terminal .cursor{display:inline-block;height:15px;width:7px;background:var(--accent);vertical-align:middle}.panel{display:flex;flex-direction:column;flex:0 0 320px;min-width:0;background:var(--low);border:1px solid var(--line);border-radius:22px;overflow:hidden}.panel[hidden]{display:none}.panel-head{padding:18px 18px 12px}.heading{display:flex;align-items:center;gap:8px}.heading h2{margin:0;font-size:16px;font-weight:600;flex:1}.heading .count{font-size:11px;background:var(--high);padding:1px 7px;border-radius:8px}.scope{font-size:11px;color:var(--muted);margin:4px 0 15px}.status{display:flex;gap:7px;align-items:center;color:var(--good);font-size:12px;margin-bottom:12px}.status.warn{color:var(--accent)}.status .led{height:6px;width:6px;border-radius:50%;background:currentColor}.panel .search{background:var(--card);font-size:12px;padding:8px 11px}.list{overflow:auto;flex:1;padding:0 10px}.repo{padding:15px 10px;border-bottom:1px solid var(--line);border-radius:10px;transition:background .5s}.repo.updated{background:var(--tint)}.repo-top{display:flex;gap:8px;align-items:center}.repo-top strong{font-size:13px;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.repo-path{font-size:11px;color:var(--muted);margin:3px 0 9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.branch{display:flex;align-items:center;gap:7px;max-width:100%;background:var(--card);padding:5px 9px;border:1px solid var(--line);border-radius:9px;text-align:left;font:12px/1.5 Consolas,monospace;color:var(--accent)}.branch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.branch svg{width:15px;height:15px}.update-label{font-size:10px;color:var(--accent)}.state-note{font-size:11px;margin:7px 0 0;color:var(--muted)}.error{color:var(--accent);font-size:11px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:5px}.error button{font-size:11px;padding:3px 9px;border:1px solid var(--line)}.footer{border-top:1px solid var(--line);padding:12px 18px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}.empty{padding:65px 20px;text-align:center}.empty svg{width:35px;height:35px;color:var(--muted);margin-bottom:15px}.empty h3{font-size:14px;font-weight:550}.empty p{font-size:12px;color:var(--muted)}.snack{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;color:var(--bg);background:var(--text);box-shadow:0 8px 30px var(--shadow);z-index:5}.snack[hidden]{display:none}.scrim{display:none}.layout-compact .sidebar{display:none}.layout-compact.app{grid-template-columns:minmax(0,1fr)}
@media(min-width:1101px){.app.layout-compact{max-width:960px;margin:auto;border-inline:1px solid var(--line)}.layout-compact .panel{position:absolute;right:14px;top:0;bottom:14px;z-index:3;width:320px;box-shadow:0 8px 30px var(--shadow)}.layout-compact .scrim.open{display:block;position:absolute;inset:0;background:#0007;z-index:2;border-radius:22px}}
@media(max-width:1100px){.panel{position:absolute;right:14px;top:0;bottom:14px;z-index:3;width:320px;box-shadow:0 8px 30px var(--shadow)}.scrim.open{display:block;position:absolute;inset:0;background:#0007;z-index:2;border-radius:22px}.app{grid-template-columns:210px minmax(0,1fr)}.agent{display:none}}
@media(max-width:700px){.app{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 118px)}.sidebar{display:none}.demo{min-height:118px;padding:10px 14px;gap:8px}.demo .right{margin-left:0;flex-wrap:wrap}.topbar{padding:12px 16px}.titles h1{font-size:17px}.actions .end{display:none}.panel{width:min(320px,calc(100% - 24px))}.terminal{padding:20px;font-size:12px}.workspace{padding-left:12px}.terminal .tip{position:static;margin-top:50px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="icon-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M6 8v8m12-8v1a5 5 0 0 1-5 5H6"/></symbol>
<symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6"/></symbol>
<symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3V7Z"/></symbol>
</defs></svg>
<div class="demo"><strong>设计预览 <span class="muted">/ 模拟数据</span></strong>
<label class="small">场景 <select id="scenario"><option value="normal">多个仓库</option><option value="empty">没有仓库</option><option value="error">读取异常</option><option value="scanning">首次扫描</option><option value="missing">Git 不可用</option></select></label>
<label class="small">主题 <select id="theme"><option value="dark">Claude 橙</option><option value="light">白色</option><option value="black">黑色</option></select></label>
<div class="right"><button id="compact" class="outline small" aria-pressed="false">窄窗口</button><button id="simulate" class="primary small">模拟外部切换分支</button><button id="add" class="outline small">模拟新增仓库</button></div></div>
<div class="app" id="app">
<aside class="sidebar" aria-label="项目列表"><div class="brand"><i>◈</i> AgentManager</div><button class="add" id="addProject">＋　添加项目</button><div class="search"><svg><use href="#icon-search"/></svg><span class="muted small">搜索项目</span></div><div><div class="group">⌄　活跃　1</div><button class="project selected" id="projectA"><span class="dot">○</span><span class="info"><strong>设备端工作区</strong><small>D:\develop\xnznrepo</small></span></button><div class="group">⌄　收藏　1</div><button class="project" id="projectB"><span class="dot muted">○</span><span class="info"><strong>AgentManager</strong><small>D:\develop\workspace_lab3\agentmanager</small></span></button><div class="group">⌄　项目　2</div><div class="project muted">◌　开发工具</div><div class="project muted">◌　技术笔记</div></div><button class="bottom" id="settings">⚙　设置</button></aside>
<main><header class="topbar"><div class="titles"><h1 id="projectTitle">设备端工作区</h1><div id="projectPath">D:\develop\xnznrepo</div></div><div class="actions"><span class="agent">○ Claude 就绪</span><button id="toggle" class="primary" aria-expanded="true" aria-controls="panel"><svg><use href="#icon-branch"/></svg>　仓库 <span id="topCount">6</span></button><button class="icon end" title="结束终端（预览）" id="end">□</button><button class="icon end" title="打开目录（预览）" id="explorer"><svg><use href="#icon-folder"/></svg></button></div></header>
<div class="workspace"><section class="terminal" aria-label="终端示意"><div class="claude">✳ Claude Code</div><div class="muted small">Opus · 设备端工作区</div><div class="output"><p>❯ 查看项目的当前开发进度</p><p>● 已读取项目文档，当前需求与实现状态已整理。</p><p>　下一步可以继续处理待办事项。</p></div><div class="rule prompt">❯ <span class="cursor"></span></div><div class="muted small">? for shortcuts</div><div class="tip">终端示意 · 右侧仓库信息独立更新</div></section>
<div id="scrim" class="scrim"></div>
<aside class="panel" id="panel" aria-label="Git 仓库"><div class="panel-head"><div class="heading"><svg><use href="#icon-branch"/></svg><h2>Git 仓库 <span class="count" id="count">6</span></h2><button class="icon" id="refresh" title="重新扫描仓库"><svg><use href="#icon-refresh"/></svg></button><button class="icon" id="close" title="收起仓库面板"><svg><use href="#icon-close"/></svg></button></div><div class="scope">当前项目目录 · 包含各层子目录</div><div class="status" id="status" role="status"><span class="led"></span><span id="statusText">自动更新中</span></div><div class="search"><svg><use href="#icon-search"/></svg><input id="filter" aria-label="搜索仓库或分支" placeholder="搜索仓库或分支" autocomplete="off"></div></div><div class="list" id="list"></div><footer class="footer"><span id="summary">6 个仓库</span><span id="checked">刚刚校验</span></footer></aside></div></main></div>
<div id="snack" class="snack" hidden role="status"></div>
<script>
const $=id=>document.getElementById(id);
const initial=[{name:'dualscreenpos_660x',path:'standard/dualscreenpos_660x',branch:'feature/ccb-aidl-release'},{name:'app_presskey_6501',path:'standard/app_presskey_6501',branch:'main'},{name:'tenglong',path:'tenglong',branch:'develop'},{name:'framework',path:'shared/framework',branch:'release/2026.11'},{name:'device-sdk',path:'shared/device-sdk',branch:'a82f1c9',note:'分离 HEAD'},{name:'printer-service',path:'tools/printer-service',branch:'feature/initial-setup',note:'尚无提交'}];
let repos=structuredClone(initial),scenario='normal',project='A',open=innerWidth>1100,changed='',flashTimer,toastTimer,scanTimer,refreshTimer,lastFocus=null;
function svg(id){const el=document.createElementNS('http://www.w3.org/2000/svg','svg');const use=document.createElementNS(el.namespaceURI,'use');use.setAttribute('href','#icon-'+id);el.append(use);return el}
function message(text){$('snack').textContent=text;$('snack').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('snack').hidden=true,2600)}
function modalMode(){return innerWidth<=1100||$('app').classList.contains('layout-compact')}
function syncPanelMode(){const modal=open&&modalMode();for(const el of document.querySelectorAll('.sidebar,.terminal,.topbar'))el.inert=modal;if(modal){$('panel').setAttribute('role','dialog');$('panel').setAttribute('aria-modal','true')}else{$('panel').removeAttribute('role');$('panel').removeAttribute('aria-modal')}}
function setOpen(value,restore=false){open=value;$('panel').hidden=!open;$('toggle').setAttribute('aria-expanded',String(open));$('scrim').classList.toggle('open',open);syncPanelMode();if(open&&modalMode())$('filter').focus();if(restore)(lastFocus&&lastFocus.isConnected?lastFocus:$('toggle')).focus()}
function empty(title,desc){const box=document.createElement('div');box.className='empty';box.append(svg('folder'));const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=desc;box.append(h,p);return box}
function render(){const query=$('filter').value.trim().toLowerCase();let data=scenario==='empty'||scenario==='missing'?[]:repos;const filtered=data.filter(r=>(r.name+' '+r.path+' '+r.branch).toLowerCase().includes(query));$('list').replaceChildren();$('count').textContent=data.length;$('topCount').textContent=scenario==='scanning'?'…':data.length;$('summary').textContent=query?filtered.length+' / '+data.length+' 个仓库':data.length+' 个仓库';$('simulate').disabled=scenario!=='normal';$('add').disabled=scenario!=='normal';$('status').classList.toggle('warn',['error','missing','scanning'].includes(scenario));$('statusText').textContent=({normal:'自动更新中',empty:'扫描完成',error:'1 个仓库读取失败',scanning:'正在扫描 · 已检查 128 个目录',missing:'未检测到 Git'})[scenario];if(scenario==='scanning'){$('list').append(empty('正在发现仓库','已发现 '+data.length+' 个，列表将在扫描完成后补齐。'));$('checked').textContent='扫描中';return}if(scenario==='missing'){$('list').append(empty('需要安装 Git','安装后点击右上角刷新，重新检测。'));$('checked').textContent='等待检测';return}if(!filtered.length){$('list').append(empty(query?'没有匹配的仓库':'未发现 Git 仓库',query?'试试其他目录名或分支名。':'在项目目录内新建或克隆仓库后会自动发现。'));return}for(const [i,r] of filtered.entries()){const row=document.createElement('article');row.className='repo'+(r.path===changed?' updated':'');const top=document.createElement('div');top.className='repo-top';const name=document.createElement('strong');name.textContent=r.name;name.title=r.name;top.append(svg('folder'),name);if(r.path===changed){const label=document.createElement('span');label.className='update-label';label.textContent='已更新';top.append(label)}const path=document.createElement('div');path.className='repo-path';path.textContent=r.path;path.title=r.path;const branch=document.createElement('button');branch.className='branch';branch.title='复制分支：'+r.branch;const text=document.createElement('span');text.textContent=r.branch;branch.append(svg('branch'),text);branch.onclick=async()=>{try{await navigator.clipboard.writeText(r.branch);message('已复制 '+r.branch)}catch{message('复制不可用，请从完整提示中查看分支：'+r.branch)}};row.append(top,path,branch);if(r.note){const note=document.createElement('p');note.className='state-note';note.textContent=r.note;row.append(note)}if(scenario==='error'&&i===0){const err=document.createElement('div');err.className='error';const msg=document.createElement('span');msg.textContent='读取失败 · 上次读取的分支';const retry=document.createElement('button');retry.textContent='重试';retry.onclick=()=>{scenario='normal';$('scenario').value='normal';$('checked').textContent='刚刚校验';render()};err.append(msg,retry);row.append(err)}$('list').append(row)}}
$('simulate').onclick=()=>{repos[0].branch=repos[0].branch==='main'?'feature/ccb-aidl-release':'main';changed=repos[0].path;$('checked').textContent='刚刚校验';render();clearTimeout(flashTimer);flashTimer=setTimeout(()=>{changed='';render()},2600)};
$('add').onclick=()=>{const index=repos.findIndex(r=>r.path.startsWith('services/new-service-'));if(index>=0){repos.splice(index,1);$('add').textContent='模拟新增仓库';changed='';render();return}const n=repos.length+1;repos.push({name:'new-service-'+n,path:'services/new-service-'+n,branch:'main'});$('add').textContent='模拟移除仓库';changed=repos.at(-1).path;render();$('list').lastElementChild?.scrollIntoView({block:'nearest'})};
$('filter').oninput=render;
$('theme').onchange=e=>document.body.className=e.target.value;
$('scenario').onchange=e=>{clearTimeout(scanTimer);clearTimeout(refreshTimer);$('refresh').disabled=false;scenario=e.target.value;changed='';$('checked').textContent=scenario==='error'?'30 秒前成功':'刚刚校验';render()};
$('toggle').onclick=()=>{lastFocus=$('toggle');setOpen(!open)};$('close').onclick=()=>setOpen(false,true);$('scrim').onclick=()=>setOpen(false,true);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open){e.preventDefault();setOpen(false,true)}else if(e.key==='Tab'&&open&&modalMode()){const controls=[...$('panel').querySelectorAll('button:not(:disabled),input')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});addEventListener('resize',syncPanelMode);
$('compact').onclick=()=>{const compact=$('app').classList.toggle('layout-compact');$('compact').setAttribute('aria-pressed',String(compact));$('compact').textContent=compact?'恢复宽窗口':'窄窗口';setOpen(!compact)};
$('refresh').onclick=()=>{clearTimeout(refreshTimer);clearTimeout(scanTimer);$('refresh').disabled=true;$('statusText').textContent='正在重新扫描…';refreshTimer=setTimeout(()=>{scenario='normal';$('scenario').value='normal';$('refresh').disabled=false;$('checked').textContent='刚刚校验';render()},700)};
function switchProject(id){clearTimeout(scanTimer);clearTimeout(refreshTimer);$('refresh').disabled=false;project=id;repos=id==='A'?structuredClone(initial):[{name:'项目根目录',path:'.',branch:'main'}];changed='';scenario='normal';$('scenario').value='normal';$('filter').value='';$('add').textContent='模拟新增仓库';$('projectTitle').textContent=id==='A'?'设备端工作区':'AgentManager';$('projectPath').textContent=id==='A'?'D:\\develop\\xnznrepo':'D:\\develop\\workspace_lab3\\agentmanager';$('projectA').classList.toggle('selected',id==='A');$('projectB').classList.toggle('selected',id==='B');$('checked').textContent='刚刚校验';render()}
$('projectA').onclick=()=>switchProject('A');$('projectB').onclick=()=>switchProject('B');for(const id of ['settings','addProject','end','explorer'])$(id).onclick=()=>message('设计稿仅演示 Git 仓库面板');
setOpen(open);render();
</script>
</body></html>
